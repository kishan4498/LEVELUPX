services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-levelupx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_MAX_MESSAGES: 200
      MP_MAX_AGE: 24h
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: levelupx-backend:local
    build:
      context: ./backend
    environment: &backend-environment
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/levelupx?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-this-with-at-least-32-random-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-this-with-another-32-random-characters}
      ROOT_SUPER_ADMIN_EMAIL: ${ROOT_SUPER_ADMIN_EMAIL:-kishanpansuriya4466@gmail.com}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-LevelUpX}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPORT_STORAGE_DIR: ${REPORT_STORAGE_DIR:-storage/reports}
      AUTH_EMAIL_DELIVERY_ENABLED: ${AUTH_EMAIL_DELIVERY_ENABLED:-true}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-smtp}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-no-reply@levelupx.local}
      AUTH_EMAIL_SMTP_HOST: ${AUTH_EMAIL_SMTP_HOST:-mailpit}
      AUTH_EMAIL_SMTP_PORT: ${AUTH_EMAIL_SMTP_PORT:-1025}
      AUTH_EMAIL_SMTP_SECURE: ${AUTH_EMAIL_SMTP_SECURE:-false}
      AUTH_EMAIL_SMTP_USERNAME: ${AUTH_EMAIL_SMTP_USERNAME:-levelupx}
      AUTH_EMAIL_SMTP_PASSWORD: ${AUTH_EMAIL_SMTP_PASSWORD:-local-mailpit-only}
      AUTH_EMAIL_API_ENDPOINT: ${AUTH_EMAIL_API_ENDPOINT:-}
      AUTH_EMAIL_API_KEY: ${AUTH_EMAIL_API_KEY:-}
      AUTH_EMAIL_OUTBOX_DIR: ${AUTH_EMAIL_OUTBOX_DIR:-}
      AUTH_EMAIL_TIMEOUT_MS: ${AUTH_EMAIL_TIMEOUT_MS:-10000}
      AUTH_EMAIL_PRINT_CODES_TO_CONSOLE: ${AUTH_EMAIL_PRINT_CODES_TO_CONSOLE:-false}
      AUTH_DEV_DISCLOSE_CODES: ${AUTH_DEV_DISCLOSE_CODES:-false}
      WEEKLY_REPORT_DELIVERY_ENABLED: ${WEEKLY_REPORT_DELIVERY_ENABLED:-false}
      WEEKLY_REPORT_DELIVERY_PROVIDER: ${WEEKLY_REPORT_DELIVERY_PROVIDER:-email}
      WEEKLY_REPORT_EMAIL_PROVIDER: ${WEEKLY_REPORT_EMAIL_PROVIDER:-smtp}
      WEEKLY_REPORT_RECIPIENT_EMAILS: ${WEEKLY_REPORT_RECIPIENT_EMAILS:-}
      WEEKLY_REPORT_EMAIL_FROM: ${WEEKLY_REPORT_EMAIL_FROM:-}
      WEEKLY_REPORT_SMTP_HOST: ${WEEKLY_REPORT_SMTP_HOST:-}
      WEEKLY_REPORT_SMTP_PORT: ${WEEKLY_REPORT_SMTP_PORT:-}
      WEEKLY_REPORT_SMTP_SECURE: ${WEEKLY_REPORT_SMTP_SECURE:-false}
      WEEKLY_REPORT_SMTP_USERNAME: ${WEEKLY_REPORT_SMTP_USERNAME:-}
      WEEKLY_REPORT_SMTP_PASSWORD: ${WEEKLY_REPORT_SMTP_PASSWORD:-}
      WEEKLY_REPORT_API_ENDPOINT: ${WEEKLY_REPORT_API_ENDPOINT:-}
      WEEKLY_REPORT_API_KEY: ${WEEKLY_REPORT_API_KEY:-}
      WEEKLY_REPORT_DELIVERY_TIMEOUT_MS: ${WEEKLY_REPORT_DELIVERY_TIMEOUT_MS:-10000}
      WEEKLY_REPORT_DELIVERY_MAX_ATTEMPTS: ${WEEKLY_REPORT_DELIVERY_MAX_ATTEMPTS:-3}
      WEEKLY_REPORT_DELIVERY_OUTBOX_DIR: ${WEEKLY_REPORT_DELIVERY_OUTBOX_DIR:-}
      AI_INSIGHT_PROVIDER: ${AI_INSIGHT_PROVIDER:-rules}
      AI_INSIGHT_ENDPOINT: ${AI_INSIGHT_ENDPOINT:-}
      AI_INSIGHT_API_KEY: ${AI_INSIGHT_API_KEY:-}
      AI_INSIGHT_EXTERNAL_PROVIDER_NAME: ${AI_INSIGHT_EXTERNAL_PROVIDER_NAME:-custom-http}
      AI_INSIGHT_EXTERNAL_AUTH_HEADER: ${AI_INSIGHT_EXTERNAL_AUTH_HEADER:-Authorization}
      AI_INSIGHT_EXTERNAL_AUTH_SCHEME: ${AI_INSIGHT_EXTERNAL_AUTH_SCHEME:-Bearer}
      AI_INSIGHT_TIMEOUT_MS: ${AI_INSIGHT_TIMEOUT_MS:-5000}
      AI_INSIGHT_PROMPT_VERSION: ${AI_INSIGHT_PROMPT_VERSION:-rules-v1}
      AI_INSIGHT_PROMPT_AUDIENCE: ${AI_INSIGHT_PROMPT_AUDIENCE:-self-directed learners}
      AI_INSIGHT_MAX_INSIGHTS: ${AI_INSIGHT_MAX_INSIGHTS:-3}
      AI_INSIGHT_SCHEDULE_ROLLOUT_PERCENT: ${AI_INSIGHT_SCHEDULE_ROLLOUT_PERCENT:-100}
      AI_INSIGHT_SCHEDULE_REQUIRE_EXTERNAL: ${AI_INSIGHT_SCHEDULE_REQUIRE_EXTERNAL:-false}
      HOSTED_SCHEDULER_ENABLED: ${HOSTED_SCHEDULER_ENABLED:-false}
      HOSTED_SCHEDULER_PROVIDER: ${HOSTED_SCHEDULER_PROVIDER:-}
      HOSTED_SCHEDULER_TIMEZONE: ${HOSTED_SCHEDULER_TIMEZONE:-UTC}
      BACKGROUND_JOBS_MODE: ${BACKGROUND_JOBS_MODE:-local-scheduler}
      JOB_SCHEDULE_LEADERBOARD_REFRESH_ENABLED: ${JOB_SCHEDULE_LEADERBOARD_REFRESH_ENABLED:-true}
      JOB_SCHEDULE_LEADERBOARD_REFRESH_CRON_UTC: ${JOB_SCHEDULE_LEADERBOARD_REFRESH_CRON_UTC:-*/15 * * * *}
      JOB_SCHEDULE_BURNOUT_PREDICTION_ENABLED: ${JOB_SCHEDULE_BURNOUT_PREDICTION_ENABLED:-true}
      JOB_SCHEDULE_BURNOUT_PREDICTION_CRON_UTC: ${JOB_SCHEDULE_BURNOUT_PREDICTION_CRON_UTC:-0 2 * * *}
      JOB_SCHEDULE_SCHEDULED_INSIGHTS_ENABLED: ${JOB_SCHEDULE_SCHEDULED_INSIGHTS_ENABLED:-true}
      JOB_SCHEDULE_SCHEDULED_INSIGHTS_CRON_UTC: ${JOB_SCHEDULE_SCHEDULED_INSIGHTS_CRON_UTC:-0 6,18 * * *}
      JOB_SCHEDULE_QUEST_REMINDERS_ENABLED: ${JOB_SCHEDULE_QUEST_REMINDERS_ENABLED:-true}
      JOB_SCHEDULE_QUEST_REMINDERS_CRON_UTC: ${JOB_SCHEDULE_QUEST_REMINDERS_CRON_UTC:-*/5 * * * *}
      JOB_SCHEDULE_DAILY_DIGEST_ENABLED: ${JOB_SCHEDULE_DAILY_DIGEST_ENABLED:-true}
      JOB_SCHEDULE_DAILY_DIGEST_CRON_UTC: ${JOB_SCHEDULE_DAILY_DIGEST_CRON_UTC:-0 * * * *}
      JOB_SCHEDULE_WEEKLY_TEAM_QUESTS_ENABLED: ${JOB_SCHEDULE_WEEKLY_TEAM_QUESTS_ENABLED:-true}
      JOB_SCHEDULE_WEEKLY_TEAM_QUESTS_CRON_UTC: ${JOB_SCHEDULE_WEEKLY_TEAM_QUESTS_CRON_UTC:-5 * * * *}
      JOB_SCHEDULE_WEEKLY_REPORT_ENABLED: ${JOB_SCHEDULE_WEEKLY_REPORT_ENABLED:-true}
      JOB_SCHEDULE_WEEKLY_REPORT_CRON_UTC: ${JOB_SCHEDULE_WEEKLY_REPORT_CRON_UTC:-0 8 * * 1}
      PUSH_DELIVERY_PROVIDER: ${PUSH_DELIVERY_PROVIDER:-disabled}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-levelupx-docker}
      REDIS_PURPOSES: ${REDIS_PURPOSES:-rate-limit,job-queue,leaderboard-cache,distributed-lock}
      SERVICE_NAME: ${SERVICE_NAME:-levelupx-api}
      RELEASE_VERSION: ${RELEASE_VERSION:-docker-local}
      ERROR_TRACKING_ENABLED: ${ERROR_TRACKING_ENABLED:-false}
      ERROR_TRACKING_PROVIDER: ${ERROR_TRACKING_PROVIDER:-none}
      ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PROVIDER: ${METRICS_PROVIDER:-prometheus}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      METRICS_AUTH_TOKEN_FILE: /run/secrets/levelupx_metrics_token
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      PROMETHEUS_PUBLIC_URL: ${PROMETHEUS_PUBLIC_URL:-http://localhost:9090}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3001/d/levelupx-overview/levelupx-operational-overview}
      ALERTMANAGER_PUBLIC_URL: ${ALERTMANAGER_PUBLIC_URL:-http://localhost:9093}
      OBSERVABILITY_QUERY_TIMEOUT_MS: ${OBSERVABILITY_QUERY_TIMEOUT_MS:-3000}
    secrets:
      - levelupx_metrics_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run prisma:seed && npm run start"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  scheduler:
    image: levelupx-backend:local
    pull_policy: never
    environment: *backend-environment
    secrets:
      - levelupx_metrics_token
    command: ["node", "dist/jobs/localScheduler.js"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./ops/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/prometheus/levelupx.rules.yml:/etc/prometheus/levelupx.rules.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - levelupx_metrics_token
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-levelupx-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-levelupx-local-change-me-now}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 10s
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: browser
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./ops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:4000}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  levelupx_metrics_token:
    file: ./ops/monitoring/secrets/metrics-token.local
