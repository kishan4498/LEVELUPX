global:
  resolve_timeout: 5m
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@levelupx.local
  smtp_require_tls: false

route:
  receiver: local-mailpit
  group_by:
    - alertname
    - severity
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: local-mailpit
    email_configs:
      - to: operator@levelupx.local
        send_resolved: true
