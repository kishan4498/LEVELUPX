global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-docker

rule_files:
  - /etc/prometheus/levelupx.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: levelupx-backend
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/levelupx_metrics_token
    static_configs:
      - targets:
          - backend:4000
        labels:
          service: levelupx-api

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
